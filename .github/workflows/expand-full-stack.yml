name: Expand full-stack source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f app.js index.html live-session.html package.json styles.css team-dashboard.html
          tar -xzf .full-source.tar.gz
          rm -f .full-source.tar.gz .github/workflows/expand-full-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build full-stack Live Command Center"
          git push
